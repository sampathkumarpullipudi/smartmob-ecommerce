
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - SmartMob</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h2>SMARTMOB ADMIN</h2>
        <nav>
            <a href="index.html">View Website</a>
        </nav>
    </header>

    <section class="auth-section">
        <div class="auth-box">

            <h1>Admin Login</h1>

            <form id="admin-login-form">

                <input
                    type="email"
                    id="admin-email"
                    placeholder="Admin Email"
                    required
                >

                <input
                    type="password"
                    id="admin-password"
                    placeholder="Admin Password"
                    required
                >

                <button type="submit">Login as Admin</button>

            </form>

            <p id="admin-login-message"></p>

        </div>
    </section>

    <footer>
        <p>© 2026 SmartMob. All Rights Reserved.</p>
    </footer>

    <script src="js/admin-auth.js"></script>

</body>
</html>
