
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Signup - SmartMob</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h2>SMARTMOB</h2>

        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Mobiles</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <!-- Signup Section -->
    <section class="auth-section">

        <div class="auth-box">

            <h1>Create Account</h1>

            <form id="signup-form">

                <!-- Full Name -->
                <input type="text"
                    id="signup-name"
                    placeholder="Full Name"
                    required>

                <!-- Email -->
                <input type="email"
                    id="signup-email"
                    placeholder="Email Address"
                    required>

                <!-- Password with Eye Icon -->
                <div class="password-wrapper">

                    <input type="password"
                        id="signup-password"
                        placeholder="Password"
                        minlength="6"
                        required>

                    <button type="button"
                        class="toggle-password"
                        data-target="signup-password">
                        👁
                    </button>

                </div>

                <!-- Confirm Password with Eye Icon -->
                <div class="password-wrapper">

                    <input type="password"
                        id="confirm-password"
                        placeholder="Confirm Password"
                        required>

                    <button type="button"
                        class="toggle-password"
                        data-target="confirm-password">
                        👁
                    </button>

                </div>

                <!-- Signup Button -->
                <button type="submit">
                    Sign Up
                </button>

            </form>

            <p>
                Already have an account?
                <a href="login.html">Login</a>
            </p>

            <p id="signup-message"></p>

        </div>

    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 SmartMob. All Rights Reserved.</p>
    </footer>

    <script src="js/auth.js"></script>

</body>
</html>
