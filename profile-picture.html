
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile Picture - SmartMob</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .picture-section {
            max-width: 750px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .picture-section h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .current-picture {
            text-align: center;
            margin-bottom: 30px;
        }

        .current-picture img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #2563eb;
        }

        .avatar-options {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin: 25px 0;
        }

        .avatar-option {
            border: 3px solid transparent;
            border-radius: 50%;
            padding: 0;
            background: none;
            cursor: pointer;
            width: 90px;
            height: 90px;
            margin: auto;
            overflow: hidden;
        }

        .avatar-option img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-option.selected {
            border-color: #2563eb;
        }

        .upload-section {
            margin: 30px 0;
            padding: 20px;
            background: #f1f5f9;
            border-radius: 10px;
            text-align: center;
        }

        .upload-section input {
            margin-top: 15px;
            max-width: 100%;
        }

        .save-picture-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .save-picture-btn:hover {
            background: #1d4ed8;
        }

        .back-profile {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }

        @media (max-width: 500px) {
            .picture-section {
                margin: 20px 12px;
                padding: 20px;
            }

            .avatar-options {
                grid-template-columns: repeat(3, 1fr);
                gap: 12px;
            }

            .avatar-option {
                width: 75px;
                height: 75px;
            }
        }

/* CUSTOM UPLOAD IMAGE BUTTON */

#upload-picture {
    display: block;
    width: 100%;
    max-width: 320px;
    margin: 18px auto 5px;
    padding: 12px;
    background: white;
    border: 2px dashed #2563eb;
    border-radius: 10px;
    color: #172554;
    font-size: 14px;
    cursor: pointer;
}

/* STYLE THE CHOOSE FILE BUTTON */

#upload-picture::file-selector-button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 7px;
    margin-right: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s ease;
}

#upload-picture::file-selector-button:hover {
    background: #1d4ed8;
}

/* UPLOAD SECTION */

.upload-section {
    margin: 30px 0;
    padding: 22px;
    background: #f1f5f9;
    border-radius: 10px;
    text-align: center;
}

    </style>
</head>

<body>

    <header>
        <h2>SMARTMOB</h2>
        <nav>
            <a href="index.html">Home</a>
            <a href="profile.html">My Profile</a>
        </nav>
    </header>

    <section class="picture-section">

        <h1>Edit Profile Picture</h1>

        <div class="current-picture">

            <img
                id="picture-preview"
                src="https://i.pravatar.cc/150?img=12"
                alt="Profile Picture">

            <p>Current Profile Picture</p>

        </div>

        <h3>Choose a Default Picture</h3>

        <div class="avatar-options">

            <button class="avatar-option" type="button"
                data-image="https://i.pravatar.cc/150?img=12">
                <img src="https://i.pravatar.cc/150?img=12" alt="Avatar 1">
            </button>

            <button class="avatar-option" type="button"
                data-image="https://i.pravatar.cc/150?img=5">
                <img src="https://i.pravatar.cc/150?img=5" alt="Avatar 2">
            </button>

            <button class="avatar-option" type="button"
                data-image="https://i.pravatar.cc/150?img=11">
                <img src="https://i.pravatar.cc/150?img=11" alt="Avatar 3">
            </button>

            <button class="avatar-option" type="button"
                data-image="https://i.pravatar.cc/150?img=32">
                <img src="https://i.pravatar.cc/150?img=32" alt="Avatar 4">
            </button>

            <button class="avatar-option" type="button"
                data-image="https://i.pravatar.cc/150?img=47">
                <img src="https://i.pravatar.cc/150?img=47" alt="Avatar 5">
            </button>

            <button class="avatar-option" type="button"
                data-image="https://i.pravatar.cc/150?img=8">
                <img src="https://i.pravatar.cc/150?img=8" alt="Avatar 6">
            </button>

            <button class="avatar-option" type="button"
                data-image="https://i.pravatar.cc/150?img=60">
                <img src="https://i.pravatar.cc/150?img=60" alt="Avatar 7">
            </button>

            <button class="avatar-option" type="button"
                data-image="https://i.pravatar.cc/150?img=68">
                <img src="https://i.pravatar.cc/150?img=68" alt="Avatar 8">
            </button>

        </div>

        <div class="upload-section">

            <h3>Or Upload Your Own Picture</h3>

            <p>Choose an image from your device.</p>

            <input
                type="file"
                id="upload-picture"
                accept="image/*">

        </div>

        <button
            type="button"
            id="save-profile-picture"
            class="save-picture-btn">

            Save Profile Picture

        </button>

        <a href="profile.html" class="back-profile">
            Back to My Profile
        </a>

    </section>

    <script src="js/profile-picture.js"></script>

</body>
</html>
