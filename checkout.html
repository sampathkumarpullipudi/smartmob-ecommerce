
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout - SmartMob</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        /* PROFILE DROPDOWN HEADER */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 5%;
        }

        header nav {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .profile-dropdown {
            position: relative;
        }

        .profile-menu-btn {
            width: 45px;
            height: 45px;
            border: none;
            border-radius: 50%;
            overflow: hidden;
            cursor: pointer;
            padding: 0;
            background: white;
        }

        .profile-menu-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-dropdown-menu {
            display: none;
            position: absolute;
            top: 55px;
            right: 0;
            width: 190px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            overflow: hidden;
        }

        .profile-dropdown-menu.show {
            display: block;
        }

        .profile-dropdown-menu a {
            display: block;
            padding: 12px 15px;
            color: #222;
            text-decoration: none;
        }

        .profile-dropdown-menu a:hover {
            background: #f1f1f1;
        }

        @media (max-width: 600px) {
            header {
                flex-wrap: wrap;
                gap: 15px;
            }

            header nav {
                gap: 12px;
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER WITH PROFILE DROPDOWN -->
    <header>

        <h2>SMARTMOB</h2>

        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Mobiles</a>

            <div class="profile-dropdown">

                <button type="button"
                    class="profile-menu-btn"
                    id="profile-menu-btn"
                    aria-label="Open profile menu">

                    <img
                        src="https://i.pravatar.cc/100?img=12"
                        alt="Profile"
                        id="header-profile-picture">

                </button>

                <div class="profile-dropdown-menu"
                    id="profile-dropdown-menu">

                    <a href="profile.html">My Profile</a>
                    <a href="my-orders.html">My Orders</a>
                    <a href="wishlist.html">Wishlist</a>
                    <a href="cart.html">Cart</a>
                    <a href="admin-login.html">Admin</a>
                    <a href="#" id="dropdown-logout">Logout</a>

                </div>

            </div>

        </nav>

    </header>


    <!-- CHECKOUT -->
    <section class="checkout-section">

        <h1>Checkout</h1>

        <div class="checkout-container">

            <!-- CUSTOMER DETAILS -->
            <div class="checkout-form">

                <h2>Delivery Information</h2>

                <!-- SAVED ADDRESS SELECTION -->
                <div class="saved-checkout-address">

                    <label for="saved-address-select">
                        Choose a Saved Delivery Address
                    </label>

                    <select id="saved-address-select">
                        <option value="">Enter a new address</option>
                    </select>

                </div>

                <form id="checkout-form">

                    <input
                        type="text"
                        id="customer-name"
                        placeholder="Full Name"
                        required>

                    <input
                        type="email"
                        id="customer-email"
                        placeholder="Email Address"
                        required>

                    <input
                        type="tel"
                        id="customer-phone"
                        placeholder="Mobile Number"
                        pattern="[0-9]{10}"
                        maxlength="10"
                        required>

                    <textarea
                        id="customer-address"
                        placeholder="Full Delivery Address"
                        required></textarea>

                    <input
                        type="text"
                        id="customer-city"
                        placeholder="City"
                        required>

                    <input
                        type="text"
                        id="customer-pincode"
                        placeholder="PIN Code"
                        pattern="[0-9]{6}"
                        maxlength="6"
                        required>

                    <h2>Payment Method</h2>

                    <label>
                        <input
                            type="radio"
                            name="payment"
                            value="Cash on Delivery"
                            checked>
                        Cash on Delivery
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="payment"
                            value="UPI">
                        UPI Payment (Google Pay / PhonePe / Paytm)
                    </label>

                    <button type="submit" class="place-order-btn">
                        Place Order
                    </button>

                </form>

            </div>


            <!-- ORDER SUMMARY -->
            <div class="checkout-summary">

                <h2>Order Summary</h2>

                <div id="checkout-items"></div>

                <hr>

                <h3>
                    Total: ₹<span id="checkout-total">0</span>
                </h3>

            </div>

        </div>

    </section>


    <!-- FOOTER -->
    <footer>
        <p>© 2026 SmartMob. All Rights Reserved.</p>
    </footer>


    <!-- EXISTING CHECKOUT JAVASCRIPT -->
     <script src="js/cart-storage.js"></script>
    <script src="js/checkout.js"></script>


    <!-- PROFILE DROPDOWN JAVASCRIPT -->
    <script>
        (function () {

            const profileButton =
                document.getElementById("profile-menu-btn");

            const profileMenu =
                document.getElementById("profile-dropdown-menu");

            const logoutButton =
                document.getElementById("dropdown-logout");

            if (profileButton && profileMenu) {

                profileButton.addEventListener("click", function (event) {

                    event.stopPropagation();

                    profileMenu.classList.toggle("show");

                });

                document.addEventListener("click", function (event) {

                    if (
                        !profileButton.contains(event.target) &&
                        !profileMenu.contains(event.target)
                    ) {
                        profileMenu.classList.remove("show");
                    }

                });

            }

            if (logoutButton) {

                logoutButton.addEventListener("click", function (event) {

                    event.preventDefault();

                    localStorage.removeItem("loggedInUser");

                    window.location.href = "login.html";

                });

            }

        })();
    </script>
<script src="js/theme.js"></script>
<script src="js/profile-picture.js"></script>
</body>
</html>
