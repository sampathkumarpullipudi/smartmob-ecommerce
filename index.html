
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartMob - Online Mobile Store</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* Profile dropdown */
        .profile-dropdown {
            position: relative;
            display: inline-block;
        }

        .profile-menu-btn {
            width: 45px;
            height: 45px;
            padding: 0;
            border: 2px solid white;
            border-radius: 50%;
            overflow: hidden;
            cursor: pointer;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-menu-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .profile-dropdown-menu {
            display: none;
            position: absolute;
            top: 55px;
            right: 0;
            min-width: 180px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            overflow: hidden;
            z-index: 1000;
        }

        .profile-dropdown-menu.show {
            display: block;
        }

        .profile-dropdown-menu a {
            display: block;
            padding: 13px 16px;
            color: #172554;
            text-decoration: none;
            font-size: 15px;
        }

        .profile-dropdown-menu a:hover {
            background: #eff6ff;
            color: #2563eb;
        }

        /* Header alignment */
        header nav {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        @media (max-width: 768px) {
            header nav {
                justify-content: center;
                flex-wrap: wrap;
                gap: 15px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <header>
        <h2>SMARTMOB</h2>

        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Mobiles</a>

            <!-- Profile Picture Dropdown -->
            <div class="profile-dropdown">

                <button
                    type="button"
                    id="profile-menu-btn"
                    class="profile-menu-btn"
                    aria-label="Open profile menu"
                    aria-expanded="false">

                    <img
                        id="header-profile-picture"
                        src="https://i.pravatar.cc/100?img=12"
                        alt="User Profile"
                    >

                </button>

                <div
                    class="profile-dropdown-menu"
                    id="profile-dropdown-menu">

                    <a href="profile.html">My Profile</a>
                    <a href="my-orders.html">My Orders</a>
                    <a href="wishlist.html">Wishlist</a>
                    <a href="cart.html">Cart</a>
                    <a href="admin-login.html">Admin</a>
                    <a href="#" id="dropdown-logout">Logout</a>

                </div>

            </div>
        </nav>
    </header>


    <!-- Hero Section -->
    <section class="hero">

        <div id="welcome-user"></div>

        <h1>Find Your Perfect Product</h1>

        <p>
            Discover smartphones and accessories at amazing prices.
        </p>

        <a href="products.html" class="btn">
            Shop Now
        </a>

    </section>


    <!-- Products Section -->
    <section class="products">

        <h2>Featured Products</h2>

        <!-- Search and Filter Section -->
        <div class="filter-section">

            <!-- Search Box -->
            <div class="search-box">

                <input
                    type="text"
                    id="search"
                    placeholder="Search products..."
                    autocomplete="off"
                >

                <button
                    type="button"
                    id="clear-search-input"
                    aria-label="Clear search"
                    title="Clear search">
                    &times;
                </button>

            </div>


            <!-- Brand Filter -->
            <select id="brand-filter">
                <option value="all">All Brands</option>
                <option value="Apple">Apple</option>
                <option value="Samsung">Samsung</option>
                <option value="OnePlus">OnePlus</option>
                <option value="Redmi">Redmi</option>
                <option value="Realme">Realme</option>
                <option value="Oppo">Oppo</option>
                <option value="Infinix">Infinix</option>
                <option value="Vivo">Vivo</option>
                <option value="Iqoo">Iqoo</option>
            </select>


            <!-- Category Filter -->
            <select id="category-filter">
                <option value="all">All Categories</option>
                <option value="Mobiles">Mobiles</option>
                <option value="Earbuds">Earbuds</option>
                <option value="Headphones">Headphones</option>
                <option value="Chargers">Chargers</option>
                <option value="Power Banks">Power Banks</option>
                <option value="Mobile Accessories">Mobile Accessories</option>
                <option value="Smartwatches">Smartwatches</option>
                <option value="Speakers">Speakers</option>
            </select>


            <!-- Price Sorting -->
            <select id="sort-price">
                <option value="default">Sort By Price</option>
                <option value="low-high">Low to High</option>
                <option value="high-low">High to Low</option>
            </select>


            <!-- Clear Filters -->
            <button type="button" id="clear-search">
                Clear Filters
            </button>

        </div>


        <!-- Products -->
        <div id="product-list" class="product-grid">
        </div>

    </section>


    <!-- Footer -->
    <footer>
        <p>© 2026 SmartMob. All Rights Reserved.</p>
    </footer>


    <!-- Existing JavaScript -->
    <script src="js/script.js"></script>


    <!-- Profile Dropdown JavaScript -->
    <script>
        (function () {

            const profileMenuBtn =
                document.getElementById("profile-menu-btn");

            const profileDropdownMenu =
                document.getElementById("profile-dropdown-menu");

            if (profileMenuBtn && profileDropdownMenu) {

                profileMenuBtn.addEventListener("click", function(event) {

                    event.stopPropagation();

                    const isOpen =
                        profileDropdownMenu.classList.toggle("show");

                    profileMenuBtn.setAttribute(
                        "aria-expanded",
                        String(isOpen)
                    );
                });

                document.addEventListener("click", function(event) {

                    if (!event.target.closest(".profile-dropdown")) {

                        profileDropdownMenu.classList.remove("show");

                        profileMenuBtn.setAttribute(
                            "aria-expanded",
                            "false"
                        );
                    }
                });
            }


            // Logout
            const dropdownLogout =
                document.getElementById("dropdown-logout");

            if (dropdownLogout) {

                dropdownLogout.addEventListener("click", function(event) {

                    event.preventDefault();

                    localStorage.removeItem("loggedInUser");

                    window.location.href = "login.html";
                });
            }

        })();
    </script>
<script src="js/profile-picture.js"></script>
</body>
</html>
